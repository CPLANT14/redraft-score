name: Update model data from sheet

# Rebuilds the model data files from the live Google Sheet (read-only, via
# the credential-free gviz endpoint) and commits them back, so the GitHub
# Pages site stays in sync. Runs daily around 6:23am Eastern and on demand
# via "Run workflow" in the Actions tab. index.html is included because the
# script bumps the ?v= asset version on every data change.

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild data from Google Sheet
        env:
          SHEET_ID: ${{ vars.MODEL_SCORES_SHEET_ID }}
        run: python scripts/update_data.py

      - name: Commit and push if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet 0-model-config.js 2-model-data.js 3-model-data.js 4-model-data.js data.csv weekly.csv index.html; then
            echo "No data change; nothing to commit."
          else
            git add 0-model-config.js 2-model-data.js 3-model-data.js 4-model-data.js data.csv weekly.csv index.html
            git commit -m "Auto-update model data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
